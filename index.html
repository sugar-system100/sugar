<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سُكّر 33 | نظام الإدارة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root{
      --bg:#fff8f6; --bg2:#fff1ee; --surface:#ffffff; --surface2:#fff8f3;
      --primary:#c96b8e; --primary-dark:#9c4e6c; --secondary:#8b5e4d;
      --accent:#f1c9bd; --text:#372822; --muted:#7f6a63; --line:#eddad2;
      --success:#2e8b57; --warning:#c57b24; --danger:#c24848; --info:#4c7dbd;
      --radius:18px; --radius-sm:12px; --shadow:0 8px 24px rgba(86,47,34,.08);
      --shadow-sm:0 4px 12px rgba(86,47,34,.06);
      --sidebar-w:290px; --topbar-h:72px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:"Cairo",sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);height:100%}
    a{text-decoration:none;color:inherit}
    button,input,select,textarea{font-family:inherit}
    img{max-width:100%}
    .hidden{display:none!important}
    .app-shell{display:grid;grid-template-columns:1fr var(--sidebar-w);min-height:100vh}
    .sidebar{
      background:linear-gradient(180deg,#fff,#fff8f6);
      border-left:1px solid var(--line);
      padding:20px 14px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      box-shadow:var(--shadow-sm)
    }
    .brand{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#fff,#ffe8e0)}
    .brand-logo{
      width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--primary),var(--secondary));font-size:22px;box-shadow:var(--shadow-sm)
    }
    .brand h1{font-size:20px;margin:0}
    .brand p{margin:0;color:var(--muted);font-size:13px}
    .user-box{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
    .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--success);margin-inline-start:8px}
    .nav-group{margin-top:16px}
    .nav-title{font-size:12px;color:var(--muted);padding:8px 10px}
    .nav-item{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;padding:12px 14px;
      border:1px solid transparent;border-radius:14px;background:transparent;color:var(--text);cursor:pointer
    }
    .nav-item:hover,.nav-item.active{background:#fff;border-color:var(--line);box-shadow:var(--shadow-sm)}
    .nav-item .left{display:flex;align-items:center;gap:10px}
    .nav-item i{width:18px;text-align:center;color:var(--primary-dark)}
    .main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .topbar{
      height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.8);backdrop-filter:blur(10px)
    }
    .breadcrumbs{font-size:13px;color:var(--muted)}
    .topbar-actions{display:flex;gap:10px;align-items:center}
    .search-mini,.btn,.input,.select,.textarea{
      border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:var(--text)
    }
    .search-mini{min-width:240px}
    .btn{cursor:pointer;transition:.2s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none}
    .btn-secondary{background:linear-gradient(135deg,var(--secondary),#6a473a);color:#fff;border:none}
    .btn-soft{background:#fff3ef}
    .btn-success{background:var(--success);color:#fff;border:none}
    .btn-danger{background:var(--danger);color:#fff;border:none}
    .btn-warning{background:var(--warning);color:#fff;border:none}
    .btn-icon{width:44px;height:44px;padding:0;display:grid;place-items:center}
    .content{flex:1;overflow:auto;padding:20px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
    .page-head h2{margin:0;font-size:28px}
    .page-head p{margin:6px 0 0;color:var(--muted)}
    .kpi-grid,.grid-2,.grid-3,.grid-4{display:grid;gap:16px}
    .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);padding:16px;min-width:0}
    .kpi{display:flex;justify-content:space-between;align-items:flex-start}
    .kpi .value{font-size:26px;font-weight:800}
    .kpi .label{color:var(--muted);font-size:13px}
    .kpi .icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#fff3ef;color:var(--primary-dark)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:12px 10px;border-bottom:1px solid #f3e7e2;text-align:right;vertical-align:top}
    th{background:#fff8f3;color:#6d5952;position:sticky;top:0;z-index:1}
    tr:hover td{background:#fffdfa}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .b-success{background:#e9f8ef;color:#1f7a46}
    .b-warning{background:#fff4e4;color:#a56613}
    .b-danger{background:#ffe9e9;color:#b33e3e}
    .b-info{background:#e9f1ff;color:#406ea7}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
    .toolbar .grow{flex:1}
    .pos-layout{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px}
    .cat-list,.product-grid,.cart-list{max-height:calc(100vh - 260px);overflow:auto}
    .cat-btn,.product-card,.cart-item,.branch-card,.mini-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}
    .cat-btn{width:100%;margin-bottom:8px;cursor:pointer;text-align:right}
    .cat-btn.active{background:#fff3ef;border-color:#efc4b7}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .product-card{cursor:pointer;box-shadow:var(--shadow-sm)}
    .product-card small,.muted{color:var(--muted)}
    .cart-item{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
    .split{display:flex;gap:10px;flex-wrap:wrap}
    .split > *{flex:1}
    .auth-screen{
      min-height:100vh;display:grid;place-items:center;padding:20px;
      background:
        radial-gradient(circle at top right,#ffdeda 0%,transparent 30%),
        radial-gradient(circle at bottom left,#f4d8c9 0%,transparent 30%),
        linear-gradient(180deg,#fff8f6,#fff0eb)
    }
    .login-card{
      width:min(560px,100%);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
      border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)
    }
    .login-brand{text-align:center;margin-bottom:20px}
    .login-brand .icon{
      width:84px;height:84px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:34px
    }
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .field label{font-size:14px;font-weight:700}
    .input,.select,.textarea{width:100%}
    .textarea{min-height:90px;resize:vertical}
    .login-actions{display:flex;gap:10px;margin-top:8px}
    .section{margin-bottom:18px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .section-title h3{margin:0;font-size:18px}
    .modal-backdrop,.loading-overlay,.chat-panel,.toast-stack,.scanner-box{position:fixed;z-index:1000}
    .loading-overlay{
      inset:0;background:rgba(55,40,34,.25);backdrop-filter:blur(4px);
      display:none;align-items:center;justify-content:center
    }
    .spinner{width:72px;height:72px;border-radius:50%;border:6px solid #f1d9d1;border-top-color:var(--primary);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast-stack{left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px}
    .toast{
      min-width:260px;max-width:360px;background:#fff;border:1px solid var(--line);border-right:5px solid var(--primary);
      border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)
    }
    .toast.success{border-right-color:var(--success)}
    .toast.error{border-right-color:var(--danger)}
    .modal-backdrop{
      inset:0;background:rgba(55,40,34,.28);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px
    }
    .modal{
      width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px
    }
    .modal-lg{width:min(1100px,100%)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .modal-head h3{margin:0}
    .chat-widget{
      position:fixed;left:18px;bottom:18px;z-index:999;
      width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;box-shadow:var(--shadow);cursor:pointer
    }
    .chat-panel{
      left:18px;bottom:88px;width:min(420px,calc(100vw - 36px));height:560px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:none;overflow:hidden
    }
    .chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff8f3}
    .chat-tabs{display:flex;border-bottom:1px solid var(--line)}
    .chat-tab{flex:1;padding:12px;border:none;background:#fff;cursor:pointer}
    .chat-tab.active{background:#fff3ef;font-weight:800}
    .chat-body{display:grid;grid-template-columns:160px 1fr;height:calc(100% - 118px)}
    .chat-list{border-left:1px solid var(--line);overflow:auto}
    .chat-conv{overflow:auto;padding:12px;background:#fffdfa}
    .chat-item,.msg{padding:10px;border-bottom:1px solid #f7ece7;cursor:pointer}
    .msg{margin-bottom:8px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .msg.self{background:#fff0eb;border-color:#efcec2}
    .chat-send{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
    .chat-send input{flex:1}
    .scanner-box{inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
    .scanner-frame{width:min(520px,100%);background:#fff;border-radius:24px;padding:16px}
    .print-note{font-size:12px;color:var(--muted)}
    .empty{padding:26px;text-align:center;color:var(--muted)}
    .mini-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .mini-card strong{display:block;font-size:20px}
    .w-100{width:100%}
    .text-center{text-align:center}
    .text-left{text-align:left}
    .mt-10{margin-top:10px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
    .mb-10{margin-bottom:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    @media (max-width:1200px){
      .kpi-grid,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .pos-layout{grid-template-columns:1fr}
      .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media (max-width:900px){
      .app-shell{grid-template-columns:1fr}
      .sidebar{position:fixed;right:-100%;top:0;z-index:999;height:100vh;width:min(320px,92vw);transition:.25s}
      .sidebar.open{right:0}
      .main{height:auto;min-height:100vh}
      .kpi-grid,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .chat-body{grid-template-columns:1fr}
      .chat-list{border-left:none;border-bottom:1px solid var(--line);max-height:160px}
    }
  </style>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="icon"><i class="fa-solid fa-cake-candles"></i></div>
        <h1 style="margin:0">سُكّر 33</h1>
        <p class="muted">نظام إدارة الفروع والمبيعات والطلبات والمخزون</p>
      </div>

      <form id="loginForm">
        <div class="grid-2">
          <div class="field">
            <label>نوع المستخدم</label>
            <select id="loginPointType" class="select" required>
              <option value="">اختر النوع</option>
              <option value="seller">بائع / POS</option>
              <option value="cashier">كاشير</option>
              <option value="delivery">دليفري</option>
              <option value="manager">مدير فرع</option>
              <option value="crm">CRM</option>
              <option value="admin">Admin</option>
            </select>
          </div>
    <div class="field">
  <label>الفرع</label>
  <select id="loginBranch" class="select" required>
    <option value="">اختر الفرع</option>
    <option value="1">فرع 1</option>
    <option value="2">فرع 2</option>
    <option value="3">فرع 3</option>
    <option value="4">فرع 4</option>
    <option value="5">فرع 5</option>
    <option value="6">فرع 6</option>
    <option value="7">فرع 7</option>
    <option value="8">فرع 8</option>
  </select>
</div>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input id="loginPass" class="input" type="password" required />
        </div>
        <div class="login-actions">
          <button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
        </div>
      </form>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="breadcrumbs" id="breadcrumbs">الرئيسية</div>
          <strong id="topTitle">لوحة النظام</strong>
        </div>

        <div class="topbar-actions">
          <button id="menuBtn" class="btn btn-icon btn-soft" title="القائمة"><i class="fa-solid fa-bars"></i></button>
          <input id="quickSearchInput" class="search-mini" placeholder="بحث سريع..." />
          <button id="refreshBtn" class="btn btn-icon btn-soft" title="تحديث"><i class="fa-solid fa-rotate"></i></button>
          <button id="logoutBtn" class="btn btn-icon btn-danger" title="خروج"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toastStack" class="toast-stack"></div>
  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <button id="chatWidget" class="chat-widget hidden"><i class="fa-solid fa-comments"></i></button>
  <div id="chatPanel" class="chat-panel">
    <div class="chat-head">
      <strong>الدردشة</strong>
      <button class="btn btn-soft btn-icon" onclick="App.toggleChat(false)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="chat-tabs">
      <button class="chat-tab active" data-chat-tab="private">خاص</button>
      <button class="chat-tab" data-chat-tab="branch">الفرع</button>
    </div>
    <div class="chat-body">
      <div id="chatList" class="chat-list"></div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <div id="chatConv" class="chat-conv"></div>
        <div class="chat-send">
          <input id="chatMessageInput" class="input" placeholder="اكتب رسالتك..." />
          <button id="chatSendBtn" class="btn btn-primary">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <div id="scannerBox" class="scanner-box">
    <div class="scanner-frame">
      <div class="modal-head">
        <h3>ماسح QR</h3>
        <button class="btn btn-soft btn-icon" onclick="App.stopScanner()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="reader" style="width:100%"></div>
      <div class="actions mt-10">
        <button class="btn btn-soft" onclick="App.stopScanner()">إغلاق</button>
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalBox" class="modal"></div>
  </div>

  <script>
    const GASURL = 'https://script.google.com/macros/s/AKfycbymV734Uwj25hX-mJmFlZ2Au4q-3mTc7wU4sMYhbjab4burll9vBpHQbf4NfEJHKsgb/exec';

    const App = {
      state: {
        token: '',
        user: null,
        superPass: '',
        data: {
          products: [],
          users: [],
          stock: [],
          sales: [],
          crmOrders: [],
          shifts: [],
          complaints: [],
          loyalty: [],
          forecast: [],
          expenses: [],
          returns: [],
          parkedOrders: [],
          auditLog: [],
          messages: [],
          deliveryZones: [],
          branchReports: [],
          movements: []
        },
        route: 'dashboard',
        activeCategory: 'الكل',
        cart: [],
        selectedChatTab: 'private',
        selectedChatTarget: null,
        charts: {},
        heartbeatTimer: null,
        pollTimer: null,
        chatTimer: null,
        scanner: null,

        menuByRole: {
          pos: ['pos','qr'],
          cashier: ['pos','stock','movements','reports','expenses','returns','loyalty','shifts','search'],
          delivery: ['pos','delivery','search','stock','reports','expenses','returns','loyalty'],
          crm: ['crm','crmTracking','products','complaints','stock'],
          manager: ['pos','reports','stock','forecast','loyalty','dashboard'],
          admin: ['dashboard','monitor','branchDetail','branchShifts','branchStock','branchReports','pos','crm','delivery','products','stock','movements','reports','complaints','loyalty','forecast','expenses','returns','search','users','audit','shifts']
        },

        labels: {
          dashboard:'Dashboard',
          monitor:'مراقبة الفروع',
          branchDetail:'تفاصيل الفرع',
          branchShifts:'ورديات الفرع',
          branchStock:'مخزون الفرع',
          branchReports:'تقارير الفرع',
          pos:'نقطة البيع',
          qr:'QR',
          crm:'CRM',
          crmTracking:'متابعة الطلبات',
          delivery:'التوصيل',
          products:'المنتجات',
          stock:'المخزون',
          movements:'حركات المخزون',
          reports:'التقارير',
          complaints:'الشكاوى',
          loyalty:'الولاء',
          forecast:'التوقعات',
          expenses:'المصروفات',
          returns:'المرتجعات',
          search:'بحث سريع',
          users:'المستخدمون',
          audit:'سجل العمليات',
          shifts:'الورديات'
        },

        icons: {
          dashboard:'fa-chart-line',
          monitor:'fa-building',
          branchDetail:'fa-store',
          branchShifts:'fa-clock',
          branchStock:'fa-boxes-stacked',
          branchReports:'fa-chart-pie',
          pos:'fa-cash-register',
          qr:'fa-qrcode',
          crm:'fa-headset',
          crmTracking:'fa-list-check',
          delivery:'fa-motorcycle',
          products:'fa-cookie-bite',
          stock:'fa-warehouse',
          movements:'fa-arrow-right-arrow-left',
          reports:'fa-chart-column',
          complaints:'fa-triangle-exclamation',
          loyalty:'fa-gift',
          forecast:'fa-wand-magic-sparkles',
          expenses:'fa-money-bill-wave',
          returns:'fa-rotate-left',
          search:'fa-magnifying-glass',
          users:'fa-users-gear',
          audit:'fa-clipboard-list',
          shifts:'fa-stopwatch'
        }
      },

      init() {
        this.cacheEls();
        this.bindGlobalEvents();
        this.restoreSession();
      },

      cacheEls() {
        this.el = {
          authScreen: document.getElementById('authScreen'),
          appShell: document.getElementById('appShell'),
          sidebar: document.getElementById('sidebar'),
          content: document.getElementById('content'),
          topTitle: document.getElementById('topTitle'),
          breadcrumbs: document.getElementById('breadcrumbs'),
          loading: document.getElementById('loadingOverlay'),
          toastStack: document.getElementById('toastStack'),
          modalBackdrop: document.getElementById('modalBackdrop'),
          modalBox: document.getElementById('modalBox'),
          chatWidget: document.getElementById('chatWidget'),
          chatPanel: document.getElementById('chatPanel'),
          chatList: document.getElementById('chatList'),
          chatConv: document.getElementById('chatConv'),
          chatMessageInput: document.getElementById('chatMessageInput'),
          scannerBox: document.getElementById('scannerBox')
        };
      },

      bindGlobalEvents() {
        document.getElementById('loginForm').addEventListener('submit', e => this.login(e));
        document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
        document.getElementById('refreshBtn').addEventListener('click', () => this.loadInitialData(true));
        document.getElementById('quickSearchInput').addEventListener('keydown', e => {
          if (e.key === 'Enter') this.quickSearch(e.target.value.trim());
        });
        document.getElementById('chatWidget').addEventListener('click', () => this.toggleChat(true));
        document.getElementById('chatSendBtn').addEventListener('click', () => this.sendChatMessage());
        document.getElementById('menuBtn').addEventListener('click', () => this.el.sidebar.classList.toggle('open'));
        this.el.modalBackdrop.addEventListener('click', e => {
          if (e.target === this.el.modalBackdrop) this.closeModal();
        });

        document.querySelectorAll('.chat-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.chat-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.state.selectedChatTab = btn.dataset.chatTab;
            this.state.selectedChatTarget = null;
            this.renderChat();
          });
        });
      },

      normalizeRole(rawRole = '', username = '') {
        const role = String(rawRole || '').trim().toLowerCase();
        const user = String(username || '').trim().toLowerCase();

        if (user === 'admin' || role === 'admin' || role === 'super' || role === 'إدارة') return 'admin';
        if (user === 'crmuser' || role === 'crm' || role === 'customer service' || role === 'خدمة عملاء') return 'crm';
        if (user.startsWith('seller') || role === 'seller' || role === 'pos' || role === 'مندوب_بيع' || role === 'بائع') return 'pos';
        if (user.startsWith('cash') || role === 'cashier' || role === 'كاشير') return 'cashier';
        if (user.startsWith('del') || role === 'delivery' || role === 'دليفري' || role === 'مندوب') return 'delivery';
        if (user.startsWith('mgr') || role === 'manager' || role === 'مدير_فرع' || role === 'مدير فرع' || role === 'مشرف') return 'manager';

        return role || 'pos';
      },

      mapLoginPointType(selected='') {
        const role = String(selected).trim().toLowerCase();
        const map = {
          seller: 'seller',
          pos: 'seller',
          cashier: 'cashier',
          delivery: 'delivery',
          manager: 'manager',
          crm: 'crm',
          admin: 'admin'
        };
        return map[role] || role;
      },

      saveSession() {
        try {
          localStorage.setItem('s33token', this.state.token);
          localStorage.setItem('s33user', JSON.stringify(this.state.user || null));
          localStorage.setItem('s33super', this.state.superPass || '');
        } catch (e) {}
      },

      restoreSession() {
        try {
          const token = localStorage.getItem('s33token');
          const user = JSON.parse(localStorage.getItem('s33user') || 'null');
          const superPass = localStorage.getItem('s33super');
          if (token && user) {
            user.pointType = this.normalizeRole(user.pointType, user.username);
            this.state.token = token;
            this.state.user = user;
            this.state.superPass = superPass || '';
            this.startApp();
          }
        } catch (e) {}
      },

      clearSession() {
        try {
          localStorage.removeItem('s33token');
          localStorage.removeItem('s33user');
          localStorage.removeItem('s33super');
        } catch (e) {}
      },

      async login(e) {
        e.preventDefault();
        const pointType = this.mapLoginPointType(document.getElementById('loginPointType').value);
        const branch = document.getElementById('loginBranch').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if (!pointType || !branch || !pass) return this.toast('اكمل بيانات الدخول', 'error');

        this.showLoading(true);
        try {
          const res = await this.apiGet('authenticate', { pointType, branch, pass });
          if (!res.ok) return this.toast(res.error || 'فشل تسجيل الدخول', 'error');

          res.user.pointType = this.normalizeRole(res.user.pointType, res.user.username);
          this.state.token = res.token;
          this.state.user = res.user;
          this.state.superPass = res.superPass || '';

          this.saveSession();
          await this.startApp();
          this.toast(`مرحبًا ${this.state.user.username}`, 'success');
        } catch (err) {
          this.toast(err.message || 'تعذر الاتصال بالخادم', 'error');
        } finally {
          this.showLoading(false);
        }
      },

      async startApp() {
        this.el.authScreen.classList.add('hidden');
        this.el.appShell.classList.remove('hidden');
        this.el.chatWidget.classList.remove('hidden');
        this.buildSidebar();
        await this.loadInitialData();
        this.startHeartbeat();
        this.startPolling();
        this.render();
      },

      async logout() {
        await this.stopScanner();
        clearInterval(this.state.heartbeatTimer);
        clearInterval(this.state.pollTimer);
        clearInterval(this.state.chatTimer);
        await this.safePost('setUserStatus', { status:'offline', screen:'logout' });
        this.clearSession();
        location.reload();
      },

      role() { return this.normalizeRole(this.state.user?.pointType, this.state.user?.username); },
      branch() { return String(this.state.user?.branch || '').trim(); },
      username() { return String(this.state.user?.username || '').trim(); },

      buildSidebar() {
        const role = this.role();
        const items = this.state.menuByRole[role] || ['pos'];

        this.el.sidebar.innerHTML = `
          <div class="brand">
            <div class="brand-logo"><i class="fa-solid fa-cake-candles"></i></div>
            <div>
              <h1>سُكّر 33</h1>
              <p>${this.branch()} — ${role}</p>
            </div>
          </div>

          <div class="user-box">
            <div><strong>${this.state.user?.username || '-'}</strong></div>
            <div class="muted"><span class="status-dot"></span>متصل الآن</div>
          </div>

          <div class="nav-group">
            <div class="nav-title">القائمة الرئيسية</div>
            ${items.map(key => `
              <button class="nav-item ${this.state.route===key?'active':''}" data-route="${key}">
                <span class="left"><i class="fa-solid ${this.state.icons[key]||'fa-circle'}"></i><span>${this.state.labels[key]||key}</span></span>
                <i class="fa-solid fa-angle-left"></i>
              </button>
            `).join('')}
          </div>
        `;

        this.el.sidebar.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => {
          this.state.route = btn.dataset.route;
          this.el.sidebar.classList.remove('open');
          this.render();
        }));
      },

      setPage(title, subtitle='') {
        this.el.topTitle.textContent = title;
        this.el.breadcrumbs.textContent = `الرئيسية / ${title}`;
        return `
          <div class="page-head">
            <div>
              <h2>${title}</h2>
              <p>${subtitle}</p>
            </div>
            <div class="actions">
              <button class="btn btn-soft" onclick="App.loadInitialData(true)"><i class="fa-solid fa-rotate"></i> تحديث</button>
            </div>
          </div>
        `;
      },

      render() {
        this.buildSidebar();
        const map = {
          dashboard: () => this.renderDashboard(),
          monitor: () => this.renderAdminMonitor(),
          branchDetail: () => this.renderBranchDetail(),
          branchShifts: () => this.renderBranchShifts(),
          branchStock: () => this.renderBranchStock(),
          branchReports: () => this.renderBranchReports(),
          pos: () => this.renderPOS(),
          qr: () => this.renderQR(),
          crm: () => this.renderCRM(),
          crmTracking: () => this.renderCRMTracking(),
          delivery: () => this.renderDelivery(),
          products: () => this.renderProducts(),
          stock: () => this.renderStock(),
          movements: () => this.renderMovements(),
          reports: () => this.renderReports(),
          complaints: () => this.renderComplaints(),
          loyalty: () => this.renderLoyalty(),
          forecast: () => this.renderForecast(),
          expenses: () => this.renderExpenses(),
          returns: () => this.renderReturns(),
          search: () => this.renderSearch(),
          users: () => this.renderUsers(),
          audit: () => this.renderAudit(),
          shifts: () => this.renderShifts()
        };
        this.el.content.innerHTML = (map[this.state.route] || map.dashboard)();
        this.bindDynamicEvents();
      },

      bindDynamicEvents() {
        document.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
          this.state.activeCategory = btn.dataset.cat;
          this.render();
        }));

        document.querySelectorAll('.product-card[data-item]').forEach(card => {
          card.addEventListener('click', () => {
            const idx = Number(card.dataset.item);
            const item = this.filteredProducts()[idx];
            this.openQtyModal(item);
          });
        });

        document.querySelectorAll('[data-cart-remove]').forEach(btn => btn.addEventListener('click', () => {
          this.state.cart.splice(Number(btn.dataset.cartRemove), 1);
          this.render();
        }));

        const payBtn = document.getElementById('payBtn');
        if (payBtn) payBtn.addEventListener('click', () => this.openPaymentModal());

        const parkBtn = document.getElementById('parkBtn');
        if (parkBtn) parkBtn.addEventListener('click', () => this.saveParkedOrder());

        const parkedBtn = document.getElementById('parkedBtn');
        if (parkedBtn) parkedBtn.addEventListener('click', () => this.openParkedModal());

        const qrBtn = document.getElementById('qrBtn');
        if (qrBtn) qrBtn.addEventListener('click', () => this.createQROrder());

        const scanBtn = document.getElementById('scanQrBtn');
        if (scanBtn) scanBtn.addEventListener('click', () => this.startScanner());

        const openShiftBtn = document.getElementById('openShiftBtn');
        if (openShiftBtn) openShiftBtn.addEventListener('click', () => this.openShiftModal());

        document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', async () => {
          await this.handleActionButton(btn);
        }));

        document.querySelectorAll('[data-table-search]').forEach(inp => inp.addEventListener('input', () => {
          const target = document.getElementById(inp.dataset.tableSearch);
          if (!target) return;
          const q = inp.value.trim().toLowerCase();
          [...target.querySelectorAll('tbody tr')].forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
          });
        }));

        if (document.getElementById('salesChart')) this.drawReportsCharts();
        if (document.getElementById('dashBranchChart')) this.drawDashboardCharts();
      },

      filteredProducts() {
        const products = (this.state.data.products || []).filter(p => String(p.active).toLowerCase() !== 'false' && String(p.active) !== '0');
        if (this.state.activeCategory === 'الكل') return products;
        return products.filter(p => p.cat === this.state.activeCategory);
      },

      productStock(name) {
        const row = (this.state.data.stock || []).find(s => String(s.branch) === String(this.branch()) && s.item === name);
        return Number(row?.qty || 0);
      },

      sum(arr, field) { return (arr || []).reduce((a, b) => a + Number(b[field] || 0), 0); },

      todaySales() {
        const today = new Date().toISOString().slice(0,10);
        return (this.state.data.sales || []).filter(x => String(x.date || '').startsWith(today));
      },

      renderDashboard() {
        const salesToday = this.todaySales();
        const total = this.sum(salesToday, 'total');
        const invoices = salesToday.length;
        const branches = [...new Set((salesToday || []).map(x => x.branch).filter(Boolean))];
        const openOrders = (this.state.data.crmOrders || []).filter(x => !['مكتمل','ملغي'].includes(x.status)).length;

        return `
          ${this.setPage('Dashboard','ملخص لحظي للمبيعات والفروع')}
          <div class="kpi-grid">
            ${this.kpiCard('مبيعات اليوم', this.money(total), 'fa-sack-dollar')}
            ${this.kpiCard('عدد الفواتير', invoices, 'fa-receipt')}
            ${this.kpiCard('طلبات CRM المفتوحة', openOrders, 'fa-headset')}
            ${this.kpiCard('الفروع النشطة', branches.length || 1, 'fa-store')}
          </div>

          <div class="grid-2 mt-16">
            <div class="card">
              <div class="section-title"><h3>ملخص الفروع</h3></div>
              ${this.branchSummaryTable()}
            </div>
            <div class="card">
              <div class="section-title"><h3>اتجاه المبيعات</h3></div>
              <canvas id="dashBranchChart" height="180"></canvas>
            </div>
          </div>
        `;
      },

      renderAdminMonitor() {
        const sales = this.todaySales();
        const grouped = {};
        sales.forEach(s => {
          grouped[s.branch] ||= { total:0, count:0 };
          grouped[s.branch].total += Number(s.total || 0);
          grouped[s.branch].count += 1;
        });
        const branches = [...new Set([this.branch(), ...Object.keys(grouped), ...(this.state.data.users||[]).map(u => u.branch)])].filter(Boolean);

        return `
          ${this.setPage('مراقبة الفروع','عرض سريع لأداء كل فرع')}
          <div class="grid-3">
            ${branches.map(b => `
              <div class="branch-card">
                <div class="section-title"><h3>${b}</h3><span class="badge b-info">نشط</span></div>
                <div class="mini-stats">
                  <div class="mini-card"><span class="muted">مبيعات اليوم</span><strong>${this.money(grouped[b]?.total || 0)}</strong></div>
                  <div class="mini-card"><span class="muted">فواتير</span><strong>${grouped[b]?.count || 0}</strong></div>
                </div>
                <div class="actions mt-10">
                  <button class="btn btn-soft" data-action="switch-branch-detail" data-branch="${b}">تفاصيل</button>
                  <button class="btn btn-soft" data-action="switch-branch-stock" data-branch="${b}">مخزون</button>
                  <button class="btn btn-soft" data-action="switch-branch-shifts" data-branch="${b}">ورديات</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      renderBranchDetail(branch = this.branch()) {
        const sales = (this.state.data.sales || []).filter(x => String(x.branch) === String(branch)).slice(-10).reverse();
        const users = (this.state.data.users || []).filter(x => String(x.branch) === String(branch));

            ${this.kpiCard('الورديات', (this.state.data.shifts||[]).filter(x=>String(x.branch)===String(branch)).length, 'fa-clock')}

            <div class="card"><div class="section-title"><h3>الموظفون</h3></div>${this.table([

        return `
          ${this.setPage('CRM','طلبات جديدة + تحديث حالة + إنشاء طلب')}
          <div class="toolbar">

      async apiGet(action, params={}) {
        return new Promise((resolve, reject) => {
          const cb = `jsonp_cb_${Date.now()}_${Math.floor(Math.random()*9999)}`;
          window[cb] = (data) => {
            resolve(data);
            script.remove();
            delete window[cb];
          };
          const query = new URLSearchParams({ action, callback: cb, token: this.state.token || '', ...params }).toString();
          const script = document.createElement('script');
          script.src = `${GASURL}?${query}`;
          script.onerror = () => { reject(new Error('JSONP error')); delete window[cb]; };
          document.body.appendChild(script);
        });
      },

      async apiPost(action, payload={}) {
        const body = new URLSearchParams({
          action,
          payload: JSON.stringify(payload),
          token: this.state.token || '',
          ...payload
        });
        const res = await fetch(GASURL, { method:'POST', body });
        return res.json();
      },

      async safePost(action, payload={}) {
        try { return await this.apiPost(action, payload); } catch (e) { return {ok:false,error:e.message}; }
      },

      async loadInitialData(silent=false) {
        if (!silent) this.showLoading(true);
        try {
          const res = await this.apiGet('getInitialData', { userType: this.role(), branch: this.branch(), username: this.username() });
          if (!res.ok) return this.toast(res.error || 'فشل تحميل البيانات', 'error');
          this.state.data = { ...this.state.data, ...(res.data || {}) };
          this.renderChat();
          if (!silent) this.render();
        } catch (e) {
          this.toast('تعذر تحميل البيانات', 'error');
        } finally {
          if (!silent) this.showLoading(false);
        }
      },

      startHeartbeat() {
        clearInterval(this.state.heartbeatTimer);
        this.safePost('setUserStatus', { status:'online', screen:this.state.route });
        this.state.heartbeatTimer = setInterval(() => {
          this.safePost('setUserStatus', { status:'online', screen:this.state.route });
        }, 30000);
      },

      startPolling() {
        clearInterval(this.state.pollTimer);
        clearInterval(this.state.chatTimer);
        this.state.pollTimer = setInterval(() => this.loadInitialData(true), 60000);
        this.state.chatTimer = setInterval(() => this.refreshMessages(), 15000);
      },

      async refreshMessages() {
        const res = await this.apiGet('getMessages', {});
        if (res.ok) {
          this.state.data.messages = res.data || [];
          this.renderChat();
        }
      },

      toggleChat(show=true) {
        this.el.chatPanel.style.display = show ? 'block' : 'none';
        if (show) this.renderChat();
      },

      renderChat() {
        const all = this.state.data.messages || [];
        const tab = this.state.selectedChatTab;
        const user = this.username();
        const branch = this.branch();

        let list = [];
        if (tab === 'private') {
          const names = [...new Set(all.flatMap(m => [m.fromuser || m.from_user, m.touser || m.to_user]).filter(x => x && x !== user))];
          list = names.map(n => ({id:n, label:n}));
        } else {
          list = [{id:branch, label:`غرفة ${branch}`}];
        }

        if (!this.state.selectedChatTarget && list.length) this.state.selectedChatTarget = list[0].id;
        if (tab === 'branch') this.state.selectedChatTarget = branch;

        this.el.chatList.innerHTML = list.map(item => `
          <div class="chat-item" onclick="App.selectChatTarget('${item.id}')">
            <strong>${item.label}</strong>
          </div>
        `).join('') || '<div class="empty">لا توجد محادثات</div>';

        const msgs = all.filter(m => {
          const fromUser = m.fromuser || m.from_user;
          const toUser = m.touser || m.to_user;
          const fromBranch = m.frombranch || m.from_branch;
          const toBranch = m.tobranch || m.to_branch;
          if (tab === 'branch') return m.type === 'branch' && (String(toBranch) === String(branch) || String(fromBranch) === String(branch));
          return m.type === 'private' && [fromUser, toUser].includes(user) && [fromUser, toUser].includes(this.state.selectedChatTarget);
        });

        this.el.chatConv.innerHTML = msgs.length ? msgs.map(m => {
          const fromUser = m.fromuser || m.from_user || m.frombranch || m.from_branch;
          return `
            <div class="msg ${fromUser===user ? 'self':''}">
              <strong>${fromUser}</strong>
              <div>${m.message}</div>
              <small class="muted">${m.timestamp || ''}</small>
            </div>
          `;
        }).join('') : '<div class="empty">ابدأ المحادثة</div>';

        this.el.chatConv.scrollTop = this.el.chatConv.scrollHeight;
      },

      selectChatTarget(id) {
        this.state.selectedChatTarget = id;
        this.renderChat();
      },

      async sendChatMessage() {
        const message = this.el.chatMessageInput.value.trim();
        if (!message) return;
        const payload = this.state.selectedChatTab === 'branch'
          ? { type:'branch', tobranch:this.branch(), message }
          : { type:'private', touser:this.state.selectedChatTarget, message };

        const res = await this.apiPost('sendMessage', payload);
        if (res.ok) {
          this.el.chatMessageInput.value = '';
          await this.refreshMessages();
        } else this.toast(res.error || 'فشل الإرسال', 'error');
      },

      async saveOrder() {
        const subtotal = this.state.cart.reduce((a,b)=>a+(Number(b.qty)*Number(b.price)),0);
        const discount = Number(document.getElementById('payDiscount').value || 0);
        const delivery = Number(document.getElementById('payDelivery').value || 0);
        const total = subtotal - discount + delivery;

        const payload = {
          branch: this.branch(),
          customer: document.getElementById('payCustomer').value.trim(),
          phone: document.getElementById('payPhone').value.trim(),
          address: document.getElementById('payAddress').value.trim(),
          channel: 'POS',
          status: 'مكتمل',
          subtotal, discount, delivery, total,
          cashier: this.username(),
          username: this.username(),
          notes: document.getElementById('payNotes').value.trim(),
          paymentMethod: document.getElementById('payMethod').value,
          paidAmount: Number(document.getElementById('payAmount').value || total),
          loyaltyRedeemed: Number(document.getElementById('payRedeem').value || 0),
          itemsJson: this.state.cart
        };

        this.showLoading(true);
        const res = await this.apiPost('saveOrder', payload);
        this.showLoading(false);
        if (!res.ok) return this.toast(res.error || 'فشل حفظ الطلب', 'error');

        this.toast('تم حفظ الفاتورة', 'success');
        this.state.cart = [];
        this.closeModal();
        await this.loadInitialData(true);
        this.render();
      },

      async saveParkedOrder() {
        if (!this.state.cart.length) return this.toast('لا توجد عناصر لتعليقها', 'error');
        const res = await this.apiPost('saveParkedOrder', { data: this.state.cart });
        if (res.ok) {
          this.toast('تم تعليق الفاتورة', 'success');
          this.state.cart = [];
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل تعليق الفاتورة', 'error');
      },

      openParkedModal() {
        const rows = this.state.data.parkedOrders || [];
        this.openModal('الفواتير المعلقة', `
          ${rows.length ? rows.map(r => `
            <div class="msg">
              <strong>${r.parkId}</strong>
              <div class="muted">${r.timestamp}</div>
              <div class="actions mt-10">
                <button class="btn btn-primary" onclick="App.loadParked('${r.parkId}')">تحميل</button>
                <button class="btn btn-danger" onclick="App.deleteParked('${r.parkId}')">حذف</button>
              </div>
            </div>
          `).join('') : '<div class="empty">لا توجد فواتير معلقة</div>'}
        `, 'modal-lg');
      },

      async loadParked(id) {
        const res = await this.apiPost('loadParkedOrder', { parkId:id });
        if (res.ok && res.data) {
          this.state.cart = JSON.parse(res.data.data || '[]');
          this.closeModal();
          this.render();
        } else this.toast(res.error || 'تعذر تحميل الفاتورة', 'error');
      },

      async deleteParked(id) {
        const res = await this.apiPost('deleteParkedOrder', { parkId:id });
        if (res.ok) {
          this.toast('تم حذف الفاتورة المعلقة', 'success');
          await this.loadInitialData(true);
          this.openParkedModal();
        }
      },

      async createQROrder() {
        const payload = {
          branch: this.branch(),
          customer: document.getElementById('qrCustomer')?.value?.trim() || '',
          phone: document.getElementById('qrPhone')?.value?.trim() || '',
          address: document.getElementById('qrAddress')?.value?.trim() || '',
          itemsJson: this.state.cart,
          total: this.state.cart.reduce((a,b)=>a+(Number(b.qty)*Number(b.price)),0),
          notes: document.getElementById('qrNotes')?.value?.trim() || '',
          createdBy: this.username()
        };
        const res = await this.apiPost('createQROrder', payload);
        if (!res.ok) return this.toast(res.error || 'فشل إنشاء الطلب', 'error');

        const target = document.getElementById('qrPreview') || this.el.content;
        target.innerHTML = `<div class="text-center"><div id="qrcodeBox"></div><p class="mt-10"><strong>${res.data.id}</strong></p></div>`;
        new QRCode(document.getElementById('qrcodeBox'), { text: res.data.id, width: 220, height: 220 });
        this.toast('تم إنشاء طلب QR', 'success');
      },

      async fetchQROrder(id) {
        if (!id) return;
        const res = await this.apiGet('getQROrder', { orderId:id });
        const box = document.getElementById('qrPreview');
        if (!res.ok) return box.innerHTML = `<div class="empty">${res.error || 'غير موجود'}</div>`;
        box.innerHTML = `<div class="msg"><strong>${res.data.customer || 'بدون اسم'}</strong><div>${res.data.phone || ''}</div><div>${res.data.address || ''}</div><div>${this.money(res.data.total)}</div></div>`;
      },

      async startScanner() {
        this.el.scannerBox.style.display = 'flex';
        if (!window.Html5Qrcode) return this.toast('المكتبة غير متاحة', 'error');
        this.state.scanner = new Html5Qrcode('reader');
        try {
          await this.state.scanner.start(
            { facingMode: 'environment' },
            { fps:10, qrbox:{ width:250, height:250 } },
            async (decodedText) => {
              await this.fetchQROrder(decodedText);
              await this.stopScanner();
              this.state.route = 'qr';
              this.render();
            }
          );
        } catch (e) {
          this.toast('تعذر تشغيل الكاميرا', 'error');
        }
      },

      async stopScanner() {
        this.el.scannerBox.style.display = 'none';
        if (this.state.scanner) {
          try { await this.state.scanner.stop(); await this.state.scanner.clear(); } catch (e) {}
          this.state.scanner = null;
        }
      },

      openCrmOrderModal() {
        const products = this.state.data.products || [];
        this.openModal('طلب CRM جديد', `
          <div class="grid-2">
            <div class="field"><label>اسم العميل</label><input id="crmCustomer" class="input"></div>
            <div class="field"><label>الهاتف</label><input id="crmPhone" class="input"></div>
            <div class="field"><label>العنوان</label><input id="crmAddress" class="input"></div>
            <div class="field"><label>الإجمالي</label><input id="crmTotal" class="input" type="number" step="0.01" value="0"></div>
          </div>
          <div class="field">
            <label>المنتجات</label>
            <div class="grid-3">
              ${products.map((p)=>`
                <label class="product-card" style="cursor:pointer">
                  <input type="checkbox" class="crm-prod" data-name="${p.name}" data-price="${p.price}" data-unit="${p.unit||'قطعة'}"> ${p.name} - ${this.money(p.price)}
                </label>
              `).join('')}
            </div>
          </div>
          <div class="field"><label>ملاحظات</label><textarea id="crmNotes" class="textarea"></textarea></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveCrmOrder()">حفظ</button></div>
        `, 'modal-lg');
      },

      async saveCrmOrder() {
        const items = [...document.querySelectorAll('.crm-prod:checked')].map(ch => ({
          name: ch.dataset.name, price:Number(ch.dataset.price), unit:ch.dataset.unit, qty:1
        }));
        const payload = {
          branch: this.branch(),
          customer: document.getElementById('crmCustomer').value.trim(),
          phone: document.getElementById('crmPhone').value.trim(),
          address: document.getElementById('crmAddress').value.trim(),
          itemsJson: items,
          total: Number(document.getElementById('crmTotal').value || 0),
          notes: document.getElementById('crmNotes').value.trim(),
          createdBy: this.username()
        };
        const res = await this.apiPost('saveCrmOrder', payload);
        if (res.ok) {
          this.toast('تم حفظ الطلب', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل حفظ الطلب', 'error');
      },

      openProductModal() {
        this.openModal('إضافة منتج', `
          <div class="grid-2">
            <div class="field"><label>الاسم</label><input id="prodName" class="input"></div>
            <div class="field"><label>الفئة</label><input id="prodCat" class="input"></div>
            <div class="field"><label>الوحدة</label><input id="prodUnit" class="input" value="قطعة"></div>
            <div class="field"><label>السعر</label><input id="prodPrice" class="input" type="number" step="0.01" value="0"></div>
          </div>
          <div class="field"><label>ملاحظات</label><textarea id="prodNotes" class="textarea"></textarea></div>
          <div class="field"><label><input id="prodActive" type="checkbox" checked> نشط</label></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveProduct()">حفظ</button></div>
        `);
      },

      async saveProduct() {
        const payload = {
          name: document.getElementById('prodName').value.trim(),
          cat: document.getElementById('prodCat').value.trim(),
          unit: document.getElementById('prodUnit').value.trim(),
          price: Number(document.getElementById('prodPrice').value || 0),
          notes: document.getElementById('prodNotes').value.trim(),
          active: document.getElementById('prodActive').checked
        };
        const res = await this.apiPost('saveProduct', payload);
        if (res.ok) {
          this.toast('تم حفظ المنتج', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openStockModal() {
        this.openModal('حركة مخزون', `
          <div class="grid-2">
            <div class="field"><label>الفرع</label><input id="stockBranch" class="input" value="${this.branch()}"></div>
            <div class="field"><label>الصنف</label><input id="stockItem" class="input"></div>
            <div class="field"><label>النوع</label>
              <select id="stockType" class="select"><option value="add">إضافة</option><option value="subtract">خصم</option><option value="adjust">تعديل</option></select>
            </div>
            <div class="field"><label>الكمية</label><input id="stockQty" class="input" type="number" step="0.001"></div>
          </div>
          <div class="field"><label>ملاحظات</label><textarea id="stockNotes" class="textarea"></textarea></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveStockMovement()">حفظ</button></div>
        `);
      },

      async saveStockMovement() {
        const payload = {
          branch: document.getElementById('stockBranch').value.trim(),
          item: document.getElementById('stockItem').value.trim(),
          type: document.getElementById('stockType').value,
          qty: Number(document.getElementById('stockQty').value || 0),
          notes: document.getElementById('stockNotes').value.trim()
        };
        const res = await this.apiPost('saveStockMovement', payload);
        if (res.ok) {
          this.toast('تم حفظ الحركة', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openExpenseModal() {
        this.openModal('إضافة مصروف', `
          <div class="grid-2">
            <div class="field"><label>النوع</label><input id="expType" class="input"></div>
            <div class="field"><label>المبلغ</label><input id="expAmount" class="input" type="number" step="0.01"></div>
          </div>
          <div class="field"><label>ملاحظات</label><textarea id="expNotes" class="textarea"></textarea></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveExpense()">حفظ</button></div>
        `);
      },

      async saveExpense() {
        const payload = {
          branch: this.branch(),
          type: document.getElementById('expType').value.trim(),
          amount: Number(document.getElementById('expAmount').value || 0),
          notes: document.getElementById('expNotes').value.trim()
        };
        const res = await this.apiPost('saveExpense', payload);
        if (res.ok) {
          this.toast('تم حفظ المصروف', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openReturnModal() {
        this.openModal('إضافة مرتجع', `
          <div class="grid-2">
            <div class="field"><label>رقم الفاتورة الأصلية</label><input id="retSaleId" class="input"></div>
            <div class="field"><label>المبلغ</label><input id="retAmount" class="input" type="number" step="0.01"></div>
          </div>
          <div class="field"><label>السبب</label><textarea id="retReason" class="textarea"></textarea></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveReturn()">حفظ</button></div>
        `);
      },

      async saveReturn() {
        const payload = {
          branch: this.branch(),
          originalSaleId: document.getElementById('retSaleId').value.trim(),
          amount: Number(document.getElementById('retAmount').value || 0),
          reason: document.getElementById('retReason').value.trim()
        };
        const res = await this.apiPost('saveReturn', payload);
        if (res.ok) {
          this.toast('تم حفظ المرتجع', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openComplaintModal() {
        this.openModal('إضافة شكوى', `
          <div class="grid-2">
            <div class="field"><label>الاسم</label><input id="cmpName" class="input"></div>
            <div class="field"><label>الهاتف</label><input id="cmpPhone" class="input"></div>
            <div class="field"><label>النوع</label><input id="cmpType" class="input"></div>
            <div class="field"><label>الفرع</label><input id="cmpBranch" class="input" value="${this.branch()}"></div>
          </div>
          <div class="field"><label>الوصف</label><textarea id="cmpDesc" class="textarea"></textarea></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveComplaint()">حفظ</button></div>
        `);
      },

      async saveComplaint() {
        const payload = {
          name: document.getElementById('cmpName').value.trim(),
          phone: document.getElementById('cmpPhone').value.trim(),
          type: document.getElementById('cmpType').value.trim(),
          branch: document.getElementById('cmpBranch').value.trim(),
          description: document.getElementById('cmpDesc').value.trim()
        };
        const res = await this.apiPost('saveComplaint', payload);
        if (res.ok) {
          this.toast('تم حفظ الشكوى', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openShiftModal() {
        this.openModal('فتح وردية', `
          <div class="grid-2">
            <div class="field"><label>الفرع</label><input id="shiftBranch" class="input" value="${this.branch()}"></div>
            <div class="field"><label>الكاشير</label><input id="shiftCashier" class="input" value="${this.username()}"></div>
          </div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveShift()">فتح</button></div>
        `);
      },

      async saveShift() {
        const payload = {
          branch: document.getElementById('shiftBranch').value.trim(),
          cashier: document.getElementById('shiftCashier').value.trim()
        };
        const res = await this.apiPost('saveShift', payload);
        if (res.ok) {
          this.toast('تم فتح الوردية', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      openUserModal() {
        this.openModal('إضافة مستخدم', `
          <div class="grid-2">
            <div class="field"><label>اسم المستخدم</label><input id="usrName" class="input"></div>
            <div class="field"><label>الفرع</label><input id="usrBranch" class="input"></div>
            <div class="field"><label>الدور</label><input id="usrRole" class="input" placeholder="seller / cashier / delivery / manager / crm / admin"></div>
            <div class="field"><label>الهاتف</label><input id="usrPhone" class="input"></div>
            <div class="field"><label>كلمة المرور</label><input id="usrPass" class="input"></div>
          </div>
          <div class="field"><label><input id="usrActive" type="checkbox" checked> نشط</label></div>
          <div class="actions"><button class="btn btn-primary" onclick="App.saveUser()">حفظ</button></div>
        `);
      },

      async saveUser() {
        const payload = {
          username: document.getElementById('usrName').value.trim(),
          branch: document.getElementById('usrBranch').value.trim(),
          pointType: document.getElementById('usrRole').value.trim(),
          phone: document.getElementById('usrPhone').value.trim(),
          pass: document.getElementById('usrPass').value.trim(),
          active: document.getElementById('usrActive').checked
        };
        const res = await this.apiPost('saveUser', payload);
        if (res.ok) {
          this.toast('تم حفظ المستخدم', 'success');
          this.closeModal();
          await this.loadInitialData(true);
          this.render();
        } else this.toast(res.error || 'فشل الحفظ', 'error');
      },

      async searchCustomer() {
        const phone = document.getElementById('loyaltyPhone').value.trim();
        if (!phone) return;
        const res = await this.apiPost('searchCustomer', { phone });
        const box = document.getElementById('loyaltyResult');
        if (!res.ok) return box.innerHTML = `<div class="empty">${res.error || 'غير موجود'}</div>`;
        box.innerHTML = `
          <div><strong>${res.data.customer || 'بدون اسم'}</strong></div>
          <div class="muted">${res.data.phone || ''}</div>
          <div class="mt-10"><strong>النقاط: ${res.data.points || 0}</strong></div>
          <div class="muted">الانتهاء: ${res.data.expiry || '-'}</div>
        `;
      },

      quickSearch(q) {
        q = String(q || '').trim().toLowerCase();
        const box = document.getElementById('searchResults');
        if (!box) return;
        if (!q) return box.innerHTML = `<div class="empty">أدخل عبارة بحث</div>`;

        const sales = (this.state.data.sales || []).filter(x => JSON.stringify(x).toLowerCase().includes(q));
        const crm = (this.state.data.crmOrders || []).filter(x => JSON.stringify(x).toLowerCase().includes(q));
        const users = (this.state.data.users || []).filter(x => JSON.stringify(x).toLowerCase().includes(q));

        box.innerHTML = `
          <div class="grid-3">
            <div class="card"><div class="section-title"><h3>فواتير</h3></div>${this.simpleList(sales.slice(0,10).map(x => `${x.saleId || '-'} — ${x.customer || '-'} — ${this.money(x.total)}`))}</div>
            <div class="card"><div class="section-title"><h3>CRM</h3></div>${this.simpleList(crm.slice(0,10).map(x => `${x.id || '-'} — ${x.customer || '-'} — ${x.status || '-'}`))}</div>
            <div class="card"><div class="section-title"><h3>مستخدمون</h3></div>${this.simpleList(users.slice(0,10).map(x => `${x.username || '-'} — ${x.branch || '-'} — ${x.pointType || '-'}`))}</div>
          </div>
        `;
      },

      async handleActionButton(btn) {
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        const branch = btn.dataset.branch;

        if (action === 'switch-branch-detail') {
          this.state.route = 'branchDetail';
          this.el.content.innerHTML = this.renderBranchDetail(branch);
          this.bindDynamicEvents();
          return;
        }

        if (action === 'switch-branch-stock') {
          this.state.route = 'branchStock';
          this.el.content.innerHTML = this.renderBranchStock(branch);
          this.bindDynamicEvents();
          return;
        }

        if (action === 'switch-branch-shifts') {
          this.state.route = 'branchShifts';
          this.el.content.innerHTML = this.renderBranchShifts(branch);
          this.bindDynamicEvents();
          return;
        }

        if (action === 'crm-status') {
          const res = await this.apiPost('updateCrmStatus', { id, status: btn.dataset.status });
          if (res.ok) {
            this.toast('تم تحديث الحالة', 'success');
            await this.loadInitialData(true);
            this.render();
          } else this.toast(res.error || 'فشل التحديث', 'error');
          return;
        }

        if (action === 'close-shift') {
          const res = await this.apiPost('closeShift', { id });
          if (res.ok) {
            this.toast('تم إغلاق الوردية', 'success');
            await this.loadInitialData(true);
            this.render();
          } else this.toast(res.error || 'فشل العملية', 'error');
          return;
        }

        if (action === 'reopen-shift') {
          const res = await this.apiPost('reopenShift', { id });
          if (res.ok) {
            this.toast('تمت إعادة فتح الوردية', 'success');
            await this.loadInitialData(true);
            this.render();
          } else this.toast(res.error || 'فشل العملية', 'error');
          return;
        }
      },

      drawReportsCharts() {
        const canvas = document.getElementById('salesChart');
        if (!canvas || !window.Chart) return;

        const sales = this.todaySales();
        const byMethod = {};
        sales.forEach(s => {
          const key = s.paymentMethod || 'غير محدد';
          byMethod[key] = (byMethod[key] || 0) + Number(s.total || 0);
        });

        if (this.state.charts.sales) this.state.charts.sales.destroy();
        this.state.charts.sales = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: Object.keys(byMethod),
            datasets: [{
              label: 'المبيعات',
              data: Object.values(byMethod),
              backgroundColor: '#c96b8e'
            }]
          },
          options: { responsive:true, maintainAspectRatio:false }
        });
      },

      drawDashboardCharts() {
        const canvas = document.getElementById('dashBranchChart');
        if (!canvas || !window.Chart) return;

        const rows = {};
        (this.state.data.sales || []).forEach(s => {
          rows[s.branch] = (rows[s.branch] || 0) + Number(s.total || 0);
        });

        if (this.state.charts.dash) this.state.charts.dash.destroy();
        this.state.charts.dash = new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: Object.keys(rows),
            datasets: [{
              data: Object.values(rows),
              backgroundColor: ['#c96b8e','#8b5e4d','#4c7dbd','#2e8b57','#c57b24','#a55eea','#ff7675','#00b894']
            }]
          },
          options: { responsive:true, maintainAspectRatio:false }
        });
      },

      exportCSV(filename, rows) {
        rows = rows || [];
        if (!rows.length) return this.toast('لا توجد بيانات للتصدير', 'error');
        const headers = Object.keys(rows[0]);
        const csv = [
          headers.join(','),
          ...rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g,'""')}"`).join(','))
        ].join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
